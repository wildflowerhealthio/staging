<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildflower server docs</title>
    <meta
      name="description"
      content="Interactive API reference for a running Wildflower server. Point it at your own server with ?server=."
    />
    <script type="module" crossorigin src="./assets/index-4Y_sStki.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/browser-D5dEsYps.js">
    <link rel="modulepreload" crossorigin href="./assets/reactivity.esm-bundler-ykQ30J6C.js">
    <link rel="modulepreload" crossorigin href="./assets/preload-helper-BVqBOxdn.js">
    <link rel="modulepreload" crossorigin href="./assets/runtime-core.esm-bundler-BMiJoboY.js">
    <link rel="modulepreload" crossorigin href="./assets/markdown-BSj1FMVF.js">
    <link rel="modulepreload" crossorigin href="./assets/workspace-events-DdLQW1xN.js">
    <link rel="stylesheet" crossorigin href="./assets/index-DzDZTsfr.css">
  </head>
  <body>
    <header class="brand-bar">
      <a href="https://wildflowerhealth.io/" aria-label="Wildflower, home" class="brand-bar__link">
        <img src="./app-icon.png" alt="" width="24" height="24" class="brand-bar__icon" />
        <span class="brand-bar__wordmark">Wildflower</span>
      </a>
    </header>
    <form id="server-form" class="server-bar">
      <label class="server-bar__label" for="server-url">Wildflower server</label>
      <input
        id="server-url"
        class="server-bar__input"
        type="url"
        name="server"
        spellcheck="false"
        autocomplete="url"
        placeholder="http://127.0.0.1:8080"
      />
      <button class="server-bar__submit" type="submit">Use this server</button>
      <button id="sign-in" class="server-bar__submit" type="button">Sign in</button>
      <p class="server-bar__hint">
        Every request below is sent to this origin, straight from your browser — nothing is proxied.
        The target is kept in the page URL, so a configured console can be shared as a link.
      </p>
      <p id="auth-status" class="server-bar__status" hidden></p>
    </form>
    <div id="reference"></div>
  </body>
</html>
